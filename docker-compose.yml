services:
  db:
    image: postgres:16-alpine
    container_name: komisyon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: komisyon
      POSTGRES_PASSWORD: komisyon
      POSTGRES_DB: komisyon_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U komisyon -d komisyon_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
