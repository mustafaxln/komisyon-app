services:
  db:
    image: postgres:16-alpine
    container_name: komisyon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: komisyon
      POSTGRES_PASSWORD: komisyon
      POSTGRES_DB: komisyon_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U komisyon -d komisyon_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: komisyon-api
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://komisyon:komisyon@db:5432/komisyon_db
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@komisyon.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      RUN_DB_INIT: ${RUN_DB_INIT:-}
    expose:
      - "3001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: komisyon-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
